name: Windows portable EXE
on:
  push:
    branches: [main, work]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Remove machine-specific paths from Rust artifacts
        shell: pwsh
        run: |
          $flags = "--remap-path-prefix=$env:GITHUB_WORKSPACE=. --remap-path-prefix=$env:USERPROFILE=.runner"
          "RUSTFLAGS=$flags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --no-bundle --target x86_64-pc-windows-msvc -- --locked
      - name: Package portable executable
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/x86_64-pc-windows-msvc/release/prize-post-maker.exe'
          if (!(Test-Path $exe)) { throw 'Portable EXE missing' }
          New-Item -ItemType Directory -Path portable | Out-Null
          Copy-Item $exe portable/
          Copy-Item README.md portable/
          Compress-Archive -Path portable/* -DestinationPath PrizePostMaker-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PrizePostMaker-windows-x64
          path: PrizePostMaker-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
