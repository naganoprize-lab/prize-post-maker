[package]
name = "prize-post-maker"
version = "0.1.0"
description = "Local Japanese prize post composer"
authors = ["prize-post-maker contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "prize_post_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
tauri-plugin-dialog = "2"

[profile.release]
debug = 0
strip = true
